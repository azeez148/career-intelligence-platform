name: career-intelligence

x-api-environment: &api-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-career}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-2}
  DB_READY_TIMEOUT: ${DB_READY_TIMEOUT:-3}

services:
  db:
    build: {context: ./infrastructure/postgres}
    image: career-db:phase0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-career}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: {context: ./apps/api, target: runtime}
    image: career-api:phase0
    environment: *api-environment
    command: [.venv/bin/alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    build: {context: ./apps/api, target: runtime}
    image: career-api:phase0
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 5s

  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    image: career-web:phase0
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
