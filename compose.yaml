name: career-intelligence

x-api-environment: &api-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-career}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-2}
  DB_READY_TIMEOUT: ${DB_READY_TIMEOUT:-3}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  JWT_SECRET: ${JWT_SECRET:?Set an independent random JWT_SECRET}
  CSRF_SECRET: ${CSRF_SECRET:?Set an independent random CSRF_SECRET}
  RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?Set an independent random RATE_LIMIT_SECRET}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set exact browser origins}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-[]}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
  EXTRACTION_BROWSER_ENABLED: ${EXTRACTION_BROWSER_ENABLED:-true}

services:
  db:
    build: {context: ./infrastructure/postgres}
    image: career-db:phase0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-career}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.10-alpine3.22@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory-policy noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep PONG']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: {context: ./apps/api, target: runtime}
    image: career-api:phase0
    environment: *api-environment
    command: [.venv/bin/alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    build: {context: ./apps/api, target: runtime}
    image: career-api:phase0
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 5s

  worker:
    image: career-api:phase0
    environment: *api-environment
    command: [.venv/bin/celery, -A, app.workers.celery_app:celery, worker, --loglevel, INFO, -Q, "discovery,extraction,matching", --concurrency, "2", --prefetch-multiplier, "1", --soft-time-limit, "70", --time-limit, "75"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  browser-worker:
    build: {context: ./apps/api, dockerfile: Dockerfile.browser, target: runtime}
    image: career-browser:phase4
    environment: *api-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 512
    restart: unless-stopped

  dispatcher:
    image: career-api:phase0
    environment: *api-environment
    command: [.venv/bin/python, -m, app.workers.dispatcher]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    image: career-web:phase0
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  redis-data:
