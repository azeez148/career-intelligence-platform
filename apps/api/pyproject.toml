[project]
name = "career-intelligence-api"
version = "0.1.0"
description = "Career Intelligence Platform engineering foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.54",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "httpx==0.28.1",
  "argon2-cffi==25.1.0",
  "pyjwt==2.15.1",
  "email-validator==2.3.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "testcontainers[postgres]==4.15.0",
  "ruff==0.17.0",
  "mypy==1.20.2",
  "pip-audit==2.10.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires Docker and disposable PostgreSQL 17"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
files = ["app", "migrations"]
