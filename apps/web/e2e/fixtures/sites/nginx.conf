# Test-only fixture sites for the isolated Compose stack (compose.test.yaml).
server {
    listen 80;
    server_name jobs-fixture.com;
    root /srv/sites/jobs-fixture.com;
    location / { try_files $uri $uri.html $uri/index.html =404; }
}
server {
    listen 80;
    server_name spa-fixture.com;
    root /srv/sites/spa-fixture.com;
    location / { try_files $uri $uri.html $uri/index.html =404; }
}
# OpenRouter-compatible stub for AI journeys (OPENROUTER_BASE_URL=http://ai-stub/api/v1).
server {
    listen 80;
    server_name ai-stub;
    location = /api/v1/chat/completions {
        default_type application/json;
        return 200 '{"id": "stub", "object": "chat.completion", "model": "stub/model", "choices": [{"index": 0, "finish_reason": "stop", "message": {"role": "assistant", "content": "{\\"summary\\": \\"Stub assessment: the posting asks for Linux and incident response.\\", \\"requirements\\": [\\"Linux\\", \\"Incident response\\"], \\"notes\\": [\\"Salary is not stated.\\"]}"}}], "usage": {"prompt_tokens": 10, "completion_tokens": 5, "total_tokens": 15, "cost": 0}}';
    }
    location / { return 404; }
}
server {
    listen 80 default_server;
    return 404;
}
