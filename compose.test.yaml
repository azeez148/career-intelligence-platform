# Always use a separate project: docker compose -p career-phase0-test -f compose.yaml -f compose.test.yaml ...
services:
  db:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700
  redis:
    volumes: !reset []
    tmpfs:
      - /data:uid=999,gid=1000,mode=0700
  api:
    environment:
      ENVIRONMENT: development
      ALLOWED_ORIGINS: '["http://127.0.0.1:18080"]'
      TRUSTED_PROXY_CIDRS: '["172.16.0.0/12"]'
      REGISTRATION_IP_LIMIT: 100
    ports: !override ["127.0.0.1:18000:8000"]
  web:
    ports: !override ["127.0.0.1:18080:8080"]
